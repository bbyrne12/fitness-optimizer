name: Athlete OS morning poll

# Vercel's Hobby plan caps cron at once per day, which cannot hit "30 minutes
# after you wake" when wake time swings 5:15 to 9:43. So the poll lives here
# instead -- free, every 30 minutes, and it only pings the route. All the work
# (and the once-a-day guard) happens in Vercel.
#
# Times are UTC. 09:00-15:00 UTC covers 05:00-11:00 America/New_York during
# daylight saving. In winter this shifts an hour; widen the range if it matters.
on:
  schedule:
    - cron: "*/30 9-16 * * *"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app whether today's decision is ready
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.MORNING_URL }}")
          echo "HTTP $code"
          cat body.json
          # A poll that finds nothing to do is a success, not a failure.
          test "$code" = "200"
